<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arthur Curtis — Tools</title>
<meta name="description" content="The self-serve levy and apprenticeship tools, in one place — your details carry across every tool as you go.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lite.css?v=5">
<link rel="icon" type="image/svg+xml" href="../assets/fundable-favicon.svg">
<style>
  /* app-shell: the nav + the "your details" bar are persistent chrome;
     only #view swaps as you move between tools */
  .app{position:relative;z-index:1}   /* sit above the atmosphere canvas */
  /* apps use the space on desktop; stay slim only on mobile */
  @media(min-width:900px){ .app{max-width:1120px;padding-left:40px;padding-right:40px} }
  #view{min-height:44vh;view-transition-name:acview}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.001s}
  ::view-transition-old(acview){animation:vt-out .16s ease both}
  ::view-transition-new(acview){animation:vt-in .30s cubic-bezier(.2,.7,.2,1) both}
  @keyframes vt-out{to{opacity:0;transform:translateY(-8px)}}
  @keyframes vt-in{from{opacity:0;transform:translateY(12px)}}
  @media(prefers-reduced-motion:reduce){#view{view-transition-name:none}}
  /* Fundable entry splash */
  #tsplash{position:fixed;inset:0;z-index:60;background:radial-gradient(70% 70% at 50% 42%,#0b1c34,#050d1a 70%);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s ease}
  #tsplash.gone{opacity:0;pointer-events:none}
  #tsplash .tsi{text-align:center}
  #tsplash svg{width:86px;height:86px;filter:drop-shadow(0 0 24px rgba(34,211,238,.28))}
  #tsplash .ic-w{opacity:0;animation:tsp .7s cubic-bezier(.2,.8,.25,1) .1s forwards}
  #tsplash .ar{opacity:0;animation:tsf .6s ease .7s forwards}
  @keyframes tsp{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
  @keyframes tsf{to{opacity:1}}
  #tsplash .slogan{font-family:'JetBrains Mono',monospace;font-size:clamp(20px,3.6vw,30px);font-weight:500;margin-top:24px;color:var(--ink);opacity:0;animation:tsu .7s cubic-bezier(.2,.7,.2,1) .95s forwards}
  #tsplash .slogan .fw{font-weight:400;letter-spacing:.2em}
  #tsplash .hint{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-top:20px;opacity:0;animation:tsu .6s ease 1.6s forwards}
  @keyframes tsu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<style id="tool-style"></style>
</head>
<body>
<div class="app">
  <div class="lite-head"></div>
  <div id="spine"></div>
  <main id="view"></main>
</div>

<script src="../atmos.js?v=2"></script>
<script src="engine.js?v=5"></script>
<script src="spine.js?v=3"></script>
<script src="nav.js?v=17"></script>
<script src="../comfort.js?v=3"></script>
<script>if(window.AC&&AC.spine)AC.spine.mount();</script>
<script src="shell.js?v=2"></script>

</body>
</html>
